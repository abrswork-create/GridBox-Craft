name: "Step 1 - Get Unity .alf file (run once)"

on:
  workflow_dispatch:   # run manually from GitHub Actions tab

# This workflow needs NO secrets.
# It just generates a .alf file from the machine hardware ID.
# After getting the .alf, go to license.unity3d.com to get the .ulf file.

jobs:
  get-alf:
    name: Generate Unity .alf activation file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate .alf file (no secrets needed)
        uses: game-ci/unity-request-activation-file@v2
        id: request
        with:
          unityVersion: 6000.6.4f1

      - name: Upload .alf as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.x.alf
          path: ${{ steps.request.outputs.filePath }}
          retention-days: 1

# ─── NEXT STEPS after downloading the .alf artifact ───────────────────────
# 1. Download the artifact (Unity_v6000.x.alf)
# 2. Go to: https://license.unity3d.com/manual
# 3. Upload the .alf file → download the .ulf file
# 4. Run in Terminal: base64 -i ~/Downloads/Unity_v6000.x.ulf | pbcopy
# 5. Add as GitHub Secret: UNITY_LICENSE (paste from clipboard)
# 6. Also add: UNITY_EMAIL and UNITY_PASSWORD
# 7. Delete this workflow file (not needed anymore)
