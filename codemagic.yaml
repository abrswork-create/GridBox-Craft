workflows:

  # ─────────────────────────────────────────────────────────────
  #  iOS — App Store (IPA via TestFlight)
  # ─────────────────────────────────────────────────────────────
  ios-release:
    name: iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - unity_credentials   # UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
        - ios_signing         # APP_STORE_CONNECT_KEY_IDENTIFIER,
                              # APP_STORE_CONNECT_ISSUER_ID,
                              # APP_STORE_CONNECT_PRIVATE_KEY,
                              # CERTIFICATE_PRIVATE_KEY
      vars:
        UNITY_VERSION:    "6000.6.4f1"
        BUNDLE_ID:        "com.GridBoxCraft.CraftGridBox"
        XCODE_SCHEME:     "Unity-iPhone"
        XCODE_OUTPUT_DIR: "build/iOS"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    integrations:
      app_store_connect: codemagic_api_key

    scripts:
      - name: Activate Unity Personal license
        script: |
          echo "$UNITY_LICENSE" | base64 --decode > /tmp/Unity_v6000.x.ulf
          unity-editor \
            -batchmode \
            -quit \
            -logFile /dev/stdout \
            -manualLicenseFile /tmp/Unity_v6000.x.ulf

      - name: Build Xcode project from Unity
        script: |
          unity-editor \
            -batchmode \
            -quit \
            -logFile /dev/stdout \
            -projectPath "$CM_BUILD_DIR" \
            -buildTarget iOS \
            -executeMethod BuildScript.BuildIOS \
            -customBuildPath "$XCODE_OUTPUT_DIR"

      - name: Fetch code signing profiles
        script: |
          xcode-project use-profiles

      - name: Install CocoaPods
        script: |
          find "$CM_BUILD_DIR/$XCODE_OUTPUT_DIR" -name "Podfile" -execdir pod install \;
        ignore_failure: true

      - name: Build & archive IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_OUTPUT_DIR/Unity-iPhone.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false   # change to true for direct App Store release
