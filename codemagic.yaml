workflows:

  # ─────────────────────────────────────────────────────────────
  #  iOS — Build Xcode project from Unity
  # ─────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - unity_credentials   # UNITY_LICENSE
      vars:
        UNITY_VERSION:    "6000.6.4f1"
        BUNDLE_ID:        "com.GridBoxCraft.CraftGridBox"
        XCODE_SCHEME:     "Unity-iPhone"
        XCODE_OUTPUT_DIR: "build/iOS"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Activate Unity Personal license
        script: |
          echo "$UNITY_LICENSE" | base64 --decode > /tmp/Unity_v6000.x.ulf
          unity-editor \
            -batchmode \
            -quit \
            -logFile /dev/stdout \
            -manualLicenseFile /tmp/Unity_v6000.x.ulf

      - name: Build Xcode project from Unity
        script: |
          unity-editor \
            -batchmode \
            -quit \
            -logFile /dev/stdout \
            -projectPath "$CM_BUILD_DIR" \
            -buildTarget iOS \
            -executeMethod BuildScript.BuildIOS \
            -customBuildPath "$XCODE_OUTPUT_DIR"

    artifacts:
      - build/iOS/**

    # ── App Store Connect publishing (uncomment when ready) ──
    # To enable, go to Codemagic → Settings → Integrations →
    # Add App Store Connect API Key, then uncomment below:
    #
    # integrations:
    #   app_store_connect: <your_key_name>
    #
    # publishing:
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: true
    #     beta_groups:
    #       - Internal Testers
    #     submit_to_app_store: false
